name: Build and Deploy to Cloud Instance

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Deploy to Cloud Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd ~/RakshaQuant
            test -f .env || { echo "Missing ~/RakshaQuant/.env"; exit 1; }
            command -v docker >/dev/null || { echo "Docker is not installed"; exit 1; }
            docker compose version >/dev/null || { echo "Docker Compose is not available"; exit 1; }
            grep -q '^GROQ_API_KEY=.' .env || { echo "Missing GROQ_API_KEY in .env"; exit 1; }
            grep -q '^LANGSMITH_API_KEY=.' .env || { echo "Missing LANGSMITH_API_KEY in .env"; exit 1; }
            git pull origin main
            docker compose down
            docker compose up -d --build --remove-orphans
            docker compose ps