name: Build and Deploy to Cloud Instance

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Deploy to Cloud Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/TredingAI
            git pull origin main

            # Stop and remove old container if running
            docker stop trading-bot-container || true
            docker rm trading-bot-container || true

            # Build image using Dockerfile
            docker build -t trading-bot .

            # Run container using .env file
            docker run -d --name trading-bot-container --restart always --env-file .env trading-bot